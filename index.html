<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendix - Minha Loja</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f9;color:#222}
header{background:#6c3cff;color:white;padding:20px;text-align:center}
header h1{margin:0}
nav{display:flex;justify-content:center;gap:10px;padding:15px;flex-wrap:wrap}
button{border:0;padding:11px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
.primary{background:#6c3cff;color:white}
.danger{background:#ffe5e5;color:#b00020}
section{max-width:1100px;margin:20px auto;padding:20px}
.panel{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px;font:inherit}
textarea{resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.product{background:white;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.product h3{margin-bottom:5px}
.price{font-size:21px;font-weight:bold;color:#6c3cff}
#photoPreview{display:none;width:180px;height:180px;object-fit:cover;border-radius:10px;margin:5px 0 12px;border:1px solid #ddd}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none}
small{color:#666}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>

<body>

<header>
<h1>Vendix</h1>
<p>Sua loja online em um só lugar</p>
</header>

<nav>
<button class="primary" onclick="showPage('loja')">🛍️ Loja</button>
<button class="primary" onclick="showPage('carrinho')">🛒 Carrinho (<span id="cartCount">0</span>)</button>
<button class="primary" onclick="showPage('admin')">⚙️ Administrar produtos</button>
</nav>

<section id="loja">
<h2>Produtos disponíveis</h2>
<div id="products" class="grid"></div>
</section>

<section id="carrinho" class="hidden">
<div class="panel">
<h2>🛒 Meu carrinho</h2>
<div id="cartItems"></div>
<h3 id="cartTotal">Total: R$ 0,00</h3>
<label>Seu nome</label>
<input id="customerName" placeholder="Digite seu nome">
<label>Endereço para entrega</label>
<input id="customerAddress" placeholder="Digite seu endereço">
<label>Observações do pedido</label>
<textarea id="customerNotes" placeholder="Alguma observação?"></textarea>
<button class="primary" onclick="checkout()">Finalizar pelo WhatsApp</button>
</div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2 id="formTitle">Cadastrar produto</h2>

<label>Nome do produto</label>
<input id="name" placeholder="Nome do produto">

<label>Descrição</label>
<textarea id="desc" placeholder="Descrição do produto"></textarea>

<label>Preço (R$)</label>
<input id="price" type="number" min="0" step="0.01" placeholder="0,00">

<label>Estoque</label>
<input id="stock" type="number" min="0" step="1" placeholder="Quantidade disponível">

<label>Categoria</label>
<input id="category" placeholder="Ex.: Roupas, acessórios">

<label>Foto do produto</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">

<small>Formatos JPG, PNG ou WEBP. Máximo de 1,2 MB.</small>

<div>
<img id="photoPreview" alt="Prévia da foto">
</div>

<div class="actions">
<button type="button" class="danger" onclick="removePhoto()">🗑️ Remover foto</button>
<button type="button" onclick="clearForm()">Limpar formulário</button>
<button type="button" class="primary" onclick="saveProduct()">Salvar produto</button>
</div>
</div>

<div class="panel">
<h2>Produtos cadastrados</h2>
<div id="adminProducts"></div>
</div>
</section>

<footer>Vendix © 2026 — Sua loja online</footer>

<script>
const $ = id => document.getElementById(id);

let products = JSON.parse(localStorage.getItem('vendix_products') || '[]');
let cart = JSON.parse(localStorage.getItem('vendix_cart') || '[]');

let editing = null;
let photoData = '';
let photoRemoved = false;

const WHATSAPP = ''; // Coloque o DDD e número da loja, somente números.

function money(value){
  return Number(value || 0).toLocaleString('pt-BR',{
    style:'currency',currency:'BRL'
  });
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}

function saveData(){
  localStorage.setItem('vendix_products',JSON.stringify(products));
  localStorage.setItem('vendix_cart',JSON.stringify(cart));
}

function showPage(page){
  ['loja','carrinho','admin'].forEach(id=>{
    $(id).classList.toggle('hidden',id!==page);
  });

  renderProducts();
  renderCart();
  renderAdmin();
  window.scrollTo(0,0);
}

$('photo').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file)return;

  const allowed=['image/jpeg','image/png','image/webp'];

  if(!allowed.includes(file.type)){
    alert('Formato inválido! Escolha JPG, PNG ou WEBP.');
    this.value='';
    return;
  }

  if(file.size>1.2*1024*1024){
    alert('A foto deve ter no máximo 1,2 MB.');
    this.value='';
    return;
  }

  const reader=new FileReader();

  reader.onload=function(){
    photoData=reader.result;
    photoRemoved=false;
    updatePreview(photoData);
  };

  reader.readAsDataURL(file);
});

function updatePreview(src){
  const img=$('photoPreview');

  if(src){
    img.src=src;
    img.style.display='block';
  }else{
    img.removeAttribute('src');
    img.style.display='none';
  }
}

function removePhoto(){
  photoData='';
  photoRemoved=true;
  $('photo').value='';
  updatePreview('');
}

function clearForm(){
  editing=null;
  photoData='';
  photoRemoved=false;

  ['name','desc','price','stock','category','photo'].forEach(id=>{
    $(id).value='';
  });

  updatePreview('');
  $('formTitle').textContent='Cadastrar produto';
}

function saveProduct(){
  const name=$('name').value.trim();
  const desc=$('desc').value.trim();
  const price=Number($('price').value);
  const stock=Number($('stock').value);
  const category=$('category').value.trim();

  if(!name){
    alert('Digite o nome do produto.');
    return;
  }

  if($('price').value==='' || !Number.isFinite(price) || price<0){
    alert('Digite um preço válido.');
    return;
  }

  if($('stock').value==='' || !Number.isInteger(stock) || stock<0){
    alert('Digite uma quantidade válida para o estoque.');
    return;
  }

  const old=products.find(p=>p.id===editing);

  const product={
    id:editing || Date.now(),
    name,desc,price,stock,category,
    photo:photoData || (photoRemoved ? '' : (old?.photo || ''))
  };

  if(editing){
    products=products.map(p=>p.id===editing?product:p);
  }else{
    products.push(product);
  }

  saveData();
  clearForm();
  renderProducts();
  renderAdmin();

  alert('Produto salvo com sucesso!');
}

function editProduct(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;

  editing=id;
  photoData=p.photo||'';
  photoRemoved=false;

  $('formTitle').textContent='Editar produto';
  $('name').value=p.name;
  $('desc').value=p.desc;
  $('price').value=p.price;
  $('stock').value=p.stock;
  $('category').value=p.category;
  $('photo').value='';

  updatePreview(photoData);
  showPage('admin');
}

function deleteProduct(id){
  if(!confirm('Deseja excluir este produto?'))return;

  products=products.filter(p=>p.id!==id);
  cart=cart.filter(item=>item.id!==id);

  saveData();
  renderProducts();
  renderAdmin();
  renderCart();
}

function renderProducts(){
  const available=products.filter(p=>p.stock>0);

  $('products').innerHTML=available.length
    ? available.map(p=>`
      <article class="product">
        ${p.photo?`<img src="${p.photo}" alt="${escapeHTML(p.name)}">`:''}
        <h3>${escapeHTML(p.name)}</h3>
        <p>${escapeHTML(p.desc)}</p>
        <small>${escapeHTML(p.category)}</small>
        <p class="price">${money(p.price)}</p>
        <p>Estoque: ${p.stock}</p>
        <button class="primary" onclick="addToCart(${p.id})">
          Adicionar ao carrinho
        </button>
      </article>
    `).join('')
    : '<p>Nenhum produto disponível no momento.</p>';
}

function renderAdmin(){
  $('adminProducts').innerHTML=products.length
    ? products.map(p=>`
      <div class="product" style="margin-bottom:12px">
        <strong>${escapeHTML(p.name)}</strong>
        <p>${money(p.price)} — Estoque: ${p.stock}</p>
        <div class="actions">
          <button class="primary" onclick="editProduct(${p.id})">Editar</button>
          <button class="danger" onclick="deleteProduct(${p.id})">Excluir</button>
        </div>
      </div>
    `).join('')
    : '<p>Nenhum produto cadastrado.</p>';
}

function addToCart(id){
  const p=products.find(x=>x.id===id);
  if(!p || p.stock<=0)return;

  const item=cart.find(x=>x.id===id);

  if(item){
    if(item.qty>=p.stock){
      alert('Não há mais unidades disponíveis.');
      return;
    }
    item.qty++;
  }else{
    cart.push({id,qty:1});
  }

  saveData();
  renderCart();
  alert('Produto adicionado ao carrinho!');
}

function changeQty(id,delta){
  const item=cart.find(x=>x.id===id);
  const p=products.find(x=>x.id===id);
  if(!item || !p)return;

  const next=item.qty+delta;

  if(next<=0){
    cart=cart.filter(x=>x.id!==id);
  }else if(next<=p.stock){
    item.qty=next;
  }else{
    alert('Quantidade maior que o estoque disponível.');
  }

  saveData();
  renderCart();
}

function renderCart(){
  let total=0;
  let count=0;

  const validCart=cart.filter(item=>products.some(p=>p.id===item.id));
  cart=validCart;

  $('cartItems').innerHTML=cart.length
    ? cart.map(item=>{
      const p=products.find(x=>x.id===item.id);
      if(!p)return '';

      total+=p.price*item.qty;
      count+=item.qty;

      return `
        <div class="product" style="margin-bottom:12px">
          <strong>${escapeHTML(p.name)}</strong>
          <p>${money(p.price)} cada</p>
          <button onclick="changeQty(${p.id},-1)">−</button>
          <strong>${item.qty}</strong>
          <button onclick="changeQty(${p.id},1)">+</button>
          <p>Subtotal: ${money(p.price*item.qty)}</p>
        </div>
      `;
    }).join('')
    : '<p>Seu carrinho está vazio.</p>';

  $('cartTotal').textContent='Total: '+money(total);
  $('cartCount').textContent=count;
}

function checkout(){
  if(!cart.length){
    alert('Seu carrinho está vazio.');
    return;
  }

  if(!WHATSAPP){
    alert('Configure o número do WhatsApp no código antes de receber pedidos.');
    return;
  }

  const name=$('customerName').value.trim();
  const address=$('customerAddress').value.trim();
  const notes=$('customerNotes').value.trim();

  let message='Olá! Quero fazer um pedido na Vendix.\\n\\n';
  message+='Nome: '+(name||'Não informado')+'\\n';
  message+='Endereço: '+(address||'Não informado')+'\\n\\n';
  message+='*Meu pedido:*\\n';

  let total=0;

  for(const item of cart){
    const p=products.find(x=>x.id===item.id);
    if(!p)continue;

    message+=`${item.qty}x ${p.name} — ${money(p.price*item.qty)}\\n`;
    total+=p.price*item.qty;
  }

  message+='\\nTotal: '+money(total);

  if(notes)message+='\\nObservações: '+notes;

  window.open(
    'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(message),
    '_blank'
  );
}

renderProducts();
renderAdmin();
renderCart();
</script>

</body>
</html>
